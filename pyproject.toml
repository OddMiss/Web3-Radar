[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-radar"
version = "0.1.0"
description = "Hourly USD stablecoin earn-rate monitoring for major crypto exchanges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OddMiss" }]
dependencies = []

[project.scripts]
web3-radar = "web3_radar.cli:main"

[tool.setuptools.packages.find]
include = ["web3_radar*"]
